{% extends "base.html" %}

{% block content %}
<ul>
{% for page in section.pages %}
  <li>{{ page.date | date(format="%Y-%m-%d") }} <a href="{{ page.permalink }}">{{ page.title }}</a></li>
{% endfor %}
</ul>
<footer><a href="https://github.com/keinzirp">GitHub</a> · <a href="{{ get_url(path="atom.xml") }}">RSS</a></footer>
{% endblock content %}
