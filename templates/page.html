{% extends "base.html" %}

{% block title %}{{ page.title }} | {{ config.title }}{% endblock title %}

{% block content %}
<article>
  <p><a href="{{ get_url(path="@/_index.md") }}">home</a></p>
  <h1>{{ page.title }}</h1>
  <p><i>{{ page.date | date(format="%Y-%m-%d") }}</i></p>
  {{ page.content | safe }}
</article>
{% endblock content %}
